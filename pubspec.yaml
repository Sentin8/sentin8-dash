name: dash
description: Sentin8 operator dashboard - Flutter Web application.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  provider: ^6.1.0
  http: ^1.2.0
  flutter_svg: ^2.0.10+1
  web: ^1.1.1
  google_fonts: ^8.1.0
  sentin8:
    path: ../sentin8-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
